<?xml version="1.0" encoding="UTF-8"?>
<!--
  APP ICON — PROD CHANNEL (SAI-3475 / SAI-3443)

  Follows Apple's macOS Big Sur+ icon template (still current through
  Sequoia / Tahoe): the icon body is 824x824 centered within a 1024x1024
  canvas, leaving 100px of transparent padding on each side so the Dock
  renders the icon at the same slot-scale as native apps. Corner radius is
  ~185 on the 824 body — the community-standard squircle approximation
  Apple references in its icon grid. macOS 26 Tahoe enforces this shape:
  icons that fill their canvas edge-to-edge get shrunk into "squircle jail"
  at the system level.

  The inner composition (dark body + brand S logo from just-s-logo.svg)
  stays in 1024-native coordinates and is scaled 0.8046875x (= 824/1024)
  by the wrapper group. Inner rx=230 renders as ~185 after the scale.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(100, 100) scale(0.8046875)">
    <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#0F1419"/>

    <!-- Brand S logo from just-s-logo.svg (462x663 native viewBox),
         scaled 1.1x to ~71% of the 1024-inner canvas height, centered. -->
    <g transform="translate(258,147) scale(1.1)">
      <path fill="#00C845" d="M198.333 398.2c-25.797.699-51.468-3.933-75.5-13.623-24.032-9.69-45.937-24.241-64.422-42.795-18.486-18.554-33.179-40.735-43.21-65.235C5.167 252.047 0 225.725 0 199.134c0-26.591 5.168-52.913 15.2-77.413s24.725-46.68 43.21-65.235c18.486-18.554 40.391-33.105 64.423-42.794 24.032-9.69 49.703-14.322 75.5-13.623V398.2Z"/>
      <path fill="#FED702" d="M99.167 663c54.768 0 99.166-44.578 99.166-99.567 0-54.99-44.398-99.567-99.166-99.567C44.398 463.866 0 508.443 0 563.433 0 618.422 44.398 663 99.167 663Z"/>
      <path fill="#F35423" d="M362.833 199.134c54.768 0 99.167-44.577 99.167-99.567C462 44.577 417.601 0 362.833 0s-99.166 44.578-99.166 99.567c0 54.99 44.398 99.567 99.166 99.567Z"/>
      <path fill="#A7FF46" d="M263.667 264.731c53.075 1.365 103.508 22.944 140.555 60.14C441.268 362.068 462 411.941 462 463.866c0 51.925-20.732 101.798-57.778 138.994-37.047 37.196-87.48 58.775-140.555 60.14V264.731Z"/>
    </g>
  </g>
</svg>
